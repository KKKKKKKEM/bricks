[project]
name = "bricks-py"
version = "1.0.0"
description = "A Python crawler framework built on the Interlace microkernel"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kem", email = "531144129@qq.com" },
]
keywords = ["crawler", "scraping", "http", "automation", "interlace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "interlace @ git+https://github.com/KKKKKKKEM/interlace.git@28fb77bf7d579ffc021f135f5c7bf0fd98b7741d",
    "urllib3>=2,<3",
    "curl-cffi>=0.16.3,<0.17",
    "lxml>=6,<7",
    "cssselect>=1.3,<2",
    "jmespath>=1.0,<2",
    "python-jsonpath[strict]>=2,<3",
    "publicsuffixlist>=1.0.2,<2",
]

[project.optional-dependencies]
redis = ["redis>=6,<7"]
mongo = ["pymongo>=4.10,<5"]
clash = ["PyYAML>=6,<7"]
httpx = ["httpx>=0.28,<1"]
requests = ["requests>=2.32,<3"]
requests-go = ["requests-go==1.0.9"]
wreq = ["wreq>=0.12.1,<0.13; python_version >= '3.11'"]
primp = ["primp==2.0.0"]
playwright = ["playwright==1.62.0"]
camoufox = ["camoufox==0.5.6", "playwright==1.62.0"]

[dependency-groups]
dev = [
    "redis>=6,<7",
    "pymongo>=4.10,<5",
    "PyYAML>=6,<7",
    "types-PyYAML>=6,<7",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "types-lxml>=2026,<2027",
    "types-jmespath>=1.0,<2",
    "types-requests>=2.32,<3",
    "httpx>=0.28,<1",
    "requests-go==1.0.9",
    "wreq>=0.12.1,<0.13; python_version >= '3.11'",
    "primp==2.0.0",
]

browser = [
    "playwright==1.62.0",
    "camoufox==0.5.6",
]

[tool.uv]
default-groups = ["dev", "browser"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


[project.urls]
Homepage = "https://github.com/KKKKKKKEM/bricks"
Repository = "https://github.com/KKKKKKKEM/bricks.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bricks"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["playwright.*", "camoufox.*", "requests_go.*", "wreq.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "UP", "I"]

[tool.hatch.build.targets.sdist]
include = [
    "bricks/",
    "tests/",
    "uv.lock",
    "README.md",
    "docs/",
    "examples/",
    "LICENSE",
    "pyproject.toml",
]
