[project]
name = "bricks-py"
version = "1.0.0"
description = "A Python crawler framework built on the Interlace microkernel"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kem", email = "531144129@qq.com" },
]
keywords = ["crawler", "scraping", "http", "automation", "interlace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "interlace @ git+https://github.com/KKKKKKKEM/interlace.git@744ac5951702693c7c7fb6aa59ea2f8b196b5982",
    "urllib3>=2,<3",
    "curl-cffi>=0.16.3,<0.17",
    "lxml>=6,<7",
    "cssselect>=1.3,<2",
    "jmespath>=1.0,<2",
    "python-jsonpath[strict]>=2,<3",
]

[project.optional-dependencies]
httpx = ["httpx>=0.28,<1"]
requests = ["requests>=2.32,<3"]
requests-go = ["requests-go==1.0.9"]
wreq = ["wreq>=0.12.1,<0.13; python_version >= '3.11'"]
primp = ["primp==2.0.0"]
playwright = ["playwright==1.62.0"]
camoufox = ["camoufox==0.5.6", "playwright==1.62.0"]

[dependency-groups]
dev = [
    "types-lxml>=2026",
    "types-jmespath>=1.0",
    "httpx>=0.28,<1",
    "requests>=2.32,<3",
    "types-requests>=2.32",
    "requests-go==1.0.9",
    "wreq>=0.12.1,<0.13; python_version >= '3.11'",
    "primp==2.0.0",
    "playwright==1.62.0",
    "camoufox==0.5.6",
]

[project.urls]
Homepage = "https://github.com/KKKKKKKEM/bricks"
Repository = "https://github.com/KKKKKKKEM/bricks.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bricks"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.sdist]
include = [
    "bricks/",
    "README.md",
    "docs/",
    "examples/",
    "LICENSE",
    "pyproject.toml",
]
