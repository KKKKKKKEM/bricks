[project]
name = "bricks-py"
version = "0.3.0"
description = "A composable graph execution engine"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kem", email = "531144129@qq.com" },
]
keywords = ["graph", "workflow", "state-machine", "automation", "engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10,<3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/KKKKKKKEM/bricks"
Repository = "https://github.com/KKKKKKKEM/bricks.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bricks"]

[tool.hatch.build.targets.sdist]
include = [
    "bricks/",
    "README.md",
    "CHANGELOG.md",
    "docs/",
    "examples/",
    "LICENSE",
    "pyproject.toml",
]
