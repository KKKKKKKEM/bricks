[project]
name = "bricks-py"
version = "1.0.0"
description = "A minimal typed graph and event runtime"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kem", email = "531144129@qq.com" },
]
keywords = ["graph", "workflow", "state-machine", "automation", "engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10,<3.14"
dependencies = ["urllib3>=2,<3", "httpx>=0.28,<1"]

[project.urls]
Homepage = "https://github.com/KKKKKKKEM/bricks"
Repository = "https://github.com/KKKKKKKEM/bricks.git"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bricks"]

[tool.mypy]
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.sdist]
include = [
    "bricks/",
    "README.md",
    "docs/",
    "examples/",
    "LICENSE",
    "pyproject.toml",
]
